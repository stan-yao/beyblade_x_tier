    <div class="owned-blades-grid" id="bladeGrid">${html}</div>`;
}

function filterOwnedBlades(val) {
  const inv = loadInventory();
  const grid = document.getElementById('bladeGrid');
  if (!grid) { renderOwnedBlades(inv, getPartsFromOwnedBlades(inv), val); return; }
  const q = val.trim().toLowerCase();
  const allBlades = DB.filter(x => x.cat === 'blade');
  const ownedSet = new Set(inv.ownedBlades || []);
  const filtered = q ? allBlades.filter(b => norm(b.name).includes(norm(q)) || norm(b.id).includes(norm(q))) : allBlades;
  const noResult = document.getElementById('bladeNoResult');
  if (noResult) noResult.style.display = filtered.length === 0 ? 'block' : 'none';
  grid.innerHTML = filtered.map(blade => {
    const owned = ownedSet.has(blade.id);
    const imgUrl = getImgUrl(blade);
    const thumb = imgUrl ? `<img class="owned-blade-thumb" src="${imgUrl}" alt="${blade.name}">` : `<div class="owned-blade-thumb-ph">${blade.name}</div>`;
    const partTags = [blade.assistBlade?`<span class="part-tag">輔助${blade.assistBlade}</span>`:'', blade.ratchet?`<span class="part-tag">${blade.ratchet}</span>`:'', blade.bit?`<span class="part-tag">${blade.bit}</span>`:''].filter(Boolean).join('');
    return `<div class="owned-blade-card${owned?' owned':''}" onclick="toggleOwnedBlade('${blade.id}')">
      <div class="owned-blade-check">${owned?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0a0b10" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div>
      ${thumb}
      <div class="owned-blade-info">
        <div class="owned-blade-name">${blade.name}</div>
        <div class="owned-blade-id">${blade.id}</div>
        ${partTags?`<div class="owned-blade-parts">${partTags}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function toggleOwnedBlade(bladeId) {
  const inv = loadInventory();
  if (!inv.ownedBlades) inv.ownedBlades = [];
  const idx = inv.ownedBlades.indexOf(bladeId);
  if (idx === -1) inv.ownedBlades.push(bladeId);
  else inv.ownedBlades.splice(idx, 1);
  saveInventory(inv);
  const fromBlades = getPartsFromOwnedBlades(inv);
  renderInvSubTab(inv, fromBlades);
}

// ── PATCH 4: 散件新增戰刃上蓋區塊 ──
function renderLooseParts(inv, fromBlades, searchVal = '') {
  const q = searchVal.trim().toLowerCase();

  const ratchets = [...new Set(DB.filter(x=>x.cat==='ratchet').map(x=>x.id))].sort();
  const bits     = [...new Set(DB.filter(x=>x.cat==='bit').map(x=>x.id))].sort();
  const assists  = [...new Set(DB.filter(x=>x.cat==='assist').map(x=>x.id))].sort();
  const covers   = [...new Set(DB.filter(x=>x.cat==='blade').map(x=>x.id))].sort();

  function matchQ(id) {
    if (!q) return true;
    const nq = norm(q);
    return norm(id).includes(nq);
  }

  function chipsHtml(list, cat) {
    return list.filter(matchQ).map(id => {
      const manualOwned = (inv[cat]||[]).includes(id);
      const autoOwned = fromBlades[cat]?.has(id);
      if (autoOwned) {
        let srcName = '';
        if (cat === 'bladeCover') {
          const src = DB.find(x=>x.cat==='blade'&&x.id===id);
          srcName = src?.name || id;
        } else {
          const srcBlades = (inv.ownedBlades||[]).filter(bid => {
            const b = DB.find(x=>x.cat==='blade'&&x.id===bid);
            if (!b) return false;
            if (cat==='ratchet') return b.ratchet === id;
            if (cat==='bit') return b.bit === id;
            if (cat==='assist') return "輔助"+b.assistBlade === id;
            return false;
          });
          srcName = srcBlades.length > 0 ? DB.find(x=>x.cat==='blade'&&x.id===srcBlades[0])?.name || srcBlades[0] : '';
        }
        return `<span class="vault-part-chip from-blade" title="來自原裝陀螺：${srcName}"><span class="chip-dot"></span>${id}<span class="chip-source">原裝</span></span>`;
      }
      return `<span class="vault-part-chip${manualOwned?' owned':''}" onclick="togglePart('${cat}','${id}')"><span class="chip-dot"></span>${id}</span>`;
    }).join('');
  }

  const totalR = new Set([...(inv.ratchet||[]), ...fromBlades.ratchet]).size;
  const totalB = new Set([...(inv.bit||[]), ...fromBlades.bit]).size;
  const totalA = new Set([...(inv.assist||[]), ...fromBlades.assist]).size;
  const totalC = new Set([...(inv.bladeCover||[]), ...fromBlades.bladeCover]).size;
  const total = totalR + totalB + totalA + totalC;

  const sections = [
    { cat:'ratchet',    label:'固鎖 Ratchet',        list:ratchets, count:totalR },
    { cat:'bit',        label:'軸心 Bit',             list:bits,     count:totalB },
    { cat:'assist',     label:'輔助戰刃 Assist',      list:assists,  count:totalA },
    { cat:'bladeCover', label:'戰刃上蓋 Blade Cover', list:covers,   count:totalC },
  ].filter(s=>s.list.length>0);

  document.getElementById("invSubContent").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:0.8rem;color:var(--muted);">點擊標記散件；<span style="color:rgba(18,239,206,0.6)">淡色</span>為原裝自動帶入</div>
      <div style="font-size:0.8rem;color:var(--accent);font-weight:700;">共 ${total} 個零件</div>
    </div>
    <div style="position:relative;margin-bottom:12px;">
      <input id="looseSearchInput" type="text" value="${searchVal}"
        placeholder="搜尋零件型號…"
        oninput="filterLooseParts(this.value)"
        style="width:100%;padding:9px 16px 9px 36px;background:var(--surface2);border:1px solid var(--border2);border-radius:999px;color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:16px;outline:none;box-sizing:border-box;transition:border-color 0.2s;-webkit-appearance:none;"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border2)'">
      <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:0.4;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    ${sections.map(s => {
      const filtered = s.list.filter(id => {
        if (!q) return true;
        if (norm(id).includes(q)) return true;
        if (s.cat === 'bladeCover') {
          const entry = DB.find(x=>x.cat==='blade'&&x.id===id);
          if (entry && norm(entry.name).includes(q)) return true;
        }
        return false;
      });
      return `<div class="vault-section" id="looseSection_${s.cat}" ${filtered.length===0&&q?'style="display:none"':''}>
        <div class="vault-section-head">
          <span class="vault-section-title">${s.label}</span>
          <span class="vault-section-count">${s.count} / ${s.list.length}</span>
        </div>
        <div class="vault-parts-grid" id="looseGrid_${s.cat}">${chipsHtml(s.list, s.cat)}</div>
      </div>`;
    }).join('')}
    <div id="looseNoResult" style="display:none;text-align:center;color:var(--muted);padding:30px 0;font-size:0.85rem;"></div>
    <div style="text-align:center;margin-top:16px;">
      <button onclick="clearInventory()" style="background:none;border:1px solid rgba(255,94,122,0.25);color:var(--danger);border-radius:999px;padding:6px 18px;font-size:0.75rem;cursor:pointer;" onmouseover="this.style.background='rgba(255,94,122,0.08)'" onmouseout="this.style.background='none'">清除所有收藏</button>
    </div>`;
}

function filterLooseParts(val) {
  const inv = loadInventory();
  const fromBlades = getPartsFromOwnedBlades(inv);
  const q = norm(val.trim());

  // 只更新各 section 的 chips，不重建整個 DOM
  const cats = ['ratchet','bit','assist','bladeCover'];
  cats.forEach(cat => {
    const grid = document.getElementById(`looseGrid_${cat}`);
    if (!grid) return;

    const allIds = cat === 'bladeCover'
      ? [...new Set(DB.filter(x=>x.cat==='blade').map(x=>x.id))].sort()
      : [...new Set(DB.filter(x=>x.cat===cat).map(x=>x.id))].sort();

    const filtered = q ? allIds.filter(id => {
      if (norm(id).includes(q)) return true;
      // 戰刃上蓋額外比對中文名稱
      if (cat === 'bladeCover') {
        const entry = DB.find(x=>x.cat==='blade'&&x.id===id);
        if (entry && norm(entry.name).includes(q)) return true;
      }
      return false;
    }) : allIds;

    grid.innerHTML = filtered.map(id => {
      const manualOwned = (inv[cat]||[]).includes(id);
      const autoOwned = fromBlades[cat]?.has(id);
      if (autoOwned) {
        return `<span class="vault-part-chip from-blade"><span class="chip-dot"></span>${id}<span class="chip-source">原裝</span></span>`;
      }
      return `<span class="vault-part-chip${manualOwned?' owned':''}" onclick="togglePart('${cat}','${id}')"><span class="chip-dot"></span>${id}</span>`;
    }).join('');

    // 更新 section 顯示/隱藏
    const section = document.getElementById(`looseSection_${cat}`);
    if (section) section.style.display = filtered.length === 0 && q ? 'none' : '';
  });

  // 找不到提示
  const noResult = document.getElementById('looseNoResult');
  if (noResult) {
    const allEmpty = cats.every(cat => {
      const grid = document.getElementById(`looseGrid_${cat}`);
      return grid && grid.innerHTML === '';
    });
    noResult.style.display = allEmpty && q ? 'block' : 'none';
    if (noResult.style.display === 'block') noResult.textContent = `找不到「${val.trim()}」`;
  }
}

function togglePart(cat, id) {
  const inv = loadInventory();
  if (!inv[cat]) inv[cat]=[];
  const idx = inv[cat].indexOf(id);
  if (idx===-1) inv[cat].push(id); else inv[cat].splice(idx,1);
  saveInventory(inv);
  const q = document.getElementById('looseSearchInput')?.value || '';
  renderLooseParts(inv, getPartsFromOwnedBlades(inv), q);
}
function clearInventory() {
  if (!confirm("確定要清除所有收藏的零件嗎？")) return;
  saveInventory({ownedBlades:[],blade:[],ratchet:[],bit:[],assist:[],bladeCover:[]});
  renderInventory();
}

function parseComboNeed(blade) {
  const combos = [];
  const rawText = [blade.comboText, blade.noteText].filter(Boolean).join("\n");
  if (!rawText) return combos;

  // 把 <br> 換成換行，再按行處理
  const lines = rawText.replace(/<br\s*\/?>\s*/gi, "\n").split(/\n/);

  // 去除前綴標籤（固鎖：/ 軸心：/ 輔助戰刃：/ 冠軍配置：等）
  function stripLabels(str) {
    return str.replace(/[^\|\/,]+：/g, ' ').trim();
  }

  lines.forEach(line => {
    const trimmed = stripLabels(line.trim());
    if (!trimmed) return;

    // | 切成左右兩段（左=固鎖段，右=軸心段）
    const pipeIdx = trimmed.indexOf("|");
    const leftRaw  = pipeIdx !== -1 ? trimmed.slice(0, pipeIdx) : trimmed;
    const rightRaw = pipeIdx !== -1 ? trimmed.slice(pipeIdx + 1) : "";

    function parseColumn(raw) {
      if (!raw.trim()) return [[]];
      return raw.split("/").map(group =>
        group.split(",").map(s => s.trim()).filter(Boolean)
      );
    }

    const leftGroups  = parseColumn(leftRaw);
    const rightGroups = parseColumn(rightRaw);

    leftGroups.forEach(leftItems => {
      const lRatchets = [], lBits = [], lAssists = [];
      leftItems.forEach(token => {
        if (token.startsWith("輔助")) lAssists.push(token);
        else if (DB.find(x => x.cat === "ratchet" && x.id === token)) lRatchets.push(token);
        else if (DB.find(x => x.cat === "bit"     && x.id === token)) lBits.push(token);
      });

      // 左欄已同時含固鎖+軸心 → 直接輸出
      if (lRatchets.length >= 1 && lBits.length >= 1) {
        combos.push({ ratchets: lRatchets, bits: lBits, assists: lAssists });
        return;
      }

      // 否則與右欄做笛卡兒積
      if (rightGroups.length === 0 || (rightGroups.length === 1 && rightGroups[0].length === 0)) {
        if (lRatchets.length || lBits.length || lAssists.length)
          combos.push({ ratchets: lRatchets, bits: lBits, assists: lAssists });
        return;
      }

      rightGroups.forEach(rightItems => {
        const ratchets = [...lRatchets], bits = [...lBits], assists = [...lAssists];
        rightItems.forEach(token => {
          if (token.startsWith("輔助")) assists.push(token);
          else if (DB.find(x => x.cat === "bit"     && x.id === token)) bits.push(token);
          else if (DB.find(x => x.cat === "ratchet" && x.id === token)) ratchets.push(token);
        });
        if (ratchets.length || bits.length || assists.length)
          combos.push({ ratchets, bits, assists });
      });
    });
  });

  return combos;
}

function renderAnalysis() {
  const inv = loadInventory();
  const fromBlades = getPartsFromOwnedBlades(inv);

  const ownedR = new Set([...(inv.ratchet||[]), ...fromBlades.ratchet]);
  const ownedB = new Set([...(inv.bit||[]),     ...fromBlades.bit]);
  const ownedA = new Set([...(inv.assist||[]),  ...fromBlades.assist]);

  const blades = DB.filter(x=>x.cat==='blade'&&(x.comboText||x.noteText));
  const complete=[], nearMiss=[];

  blades.forEach(blade=>{
    // ── PATCH 2: 用 fromBlades.blade 判斷是否擁有此戰刃 ──
    const hasThisBlade = fromBlades.blade.has(blade.id) || (inv.blade||[]).includes(blade.id);
    if (!hasThisBlade) return;

    parseComboNeed(blade).forEach(combo=>{
      const isValidCombo = combo.ratchets.length >= 1 && combo.bits.length >= 1;
      if (!isValidCombo) return;

      const nR=combo.ratchets.filter(r=>!ownedR.has(r));
      const nB=combo.bits.filter(b=>!ownedB.has(b));
      const nA=combo.assists.filter(a=>!ownedA.has(a));
      const miss=nR.length+nB.length+nA.length;
      const entry={blade,combo,neededR:nR,neededB:nB,neededA:nA,totalMissing:miss};
      if(miss===0) complete.push(entry);
      else if(miss===1) nearMiss.push(entry);
    });
  });

  function partSource(id, cat) {
    if (cat==='ratchet' && fromBlades.ratchet.has(id)) {
      const src = (inv.ownedBlades||[]).find(bid => DB.find(x=>x.cat==='blade'&&x.id===bid)?.ratchet===id);
      return src ? `<span style="font-size:0.65rem;color:var(--muted);margin-left:3px;">(${DB.find(x=>x.cat==='blade'&&x.id===src)?.name||src})</span>` : '';
    }
    if (cat==='bit' && fromBlades.bit.has(id)) {
      const src = (inv.ownedBlades||[]).find(bid => DB.find(x=>x.cat==='blade'&&x.id===bid)?.bit===id);
      return src ? `<span style="font-size:0.65rem;color:var(--muted);margin-left:3px;">(${DB.find(x=>x.cat==='blade'&&x.id===src)?.name||src})</span>` : '';
    }
    return '';
  }

  function comboHtml(e) {
    const leftParts = [
      ...e.combo.assists.map(a=>`<span class="${e.neededA.includes(a)?'missing':'have'}">${a}</span>`),
      ...e.combo.ratchets.map(r=>`<span class="${e.neededR.includes(r)?'missing':'have'}">${r}${partSource(r,'ratchet')}</span>`),
    ];
    const rightParts = [
      ...e.combo.bits.map(b=>`<span class="${e.neededB.includes(b)?'missing':'have'}">${b}${partSource(b,'bit')}</span>`),
    ];
    const sep = ' <span style="opacity:0.25;font-size:0.85em;">+</span> ';
    const pipe = ' <span style="opacity:0.4;margin:0 3px;">｜</span> ';
    const leftHtml  = leftParts.length  ? leftParts.join(sep)  : '';
    const rightHtml = rightParts.length ? rightParts.join(sep) : '';
    if (leftHtml && rightHtml) return leftHtml + pipe + rightHtml;
    return leftHtml || rightHtml;
  }

  // 依陀螺群組化
  function groupByBlade(entries) {
    const map = new Map();
    entries.forEach(e => {
      if (!map.has(e.blade.id)) map.set(e.blade.id, { blade: e.blade, combos: [] });
      map.get(e.blade.id).combos.push(e);
    });
    return [...map.values()];
  }

  function groupHtml(group, isComplete) {
    const { blade, combos } = group;
    const comboLines = combos.map(e => {
      const line = comboHtml(e);
      const missing = e.totalMissing === 1
        ? ` <span style="color:var(--warn);font-size:0.7rem;">← 缺 ${[...e.neededR,...e.neededB,...e.neededA].join('、')}</span>`
        : '';
      return `<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);line-height:1.6;">${line}${missing}</div>`;
    }).join('');

    return `<div class="analysis-item" onclick="openModal(DB.find(x=>x.id=='${blade.id}'&&x.cat=='blade'))">
      <div class="analysis-item-head">
        <span class="analysis-status">${isComplete ? '✅' : '🔧'}</span>
        <div>
          <div class="analysis-name">${blade.name}</div>
          <div class="analysis-id">${blade.id} <span style="color:var(--muted);font-size:0.68rem;">${combos.length} 組配置</span></div>
        </div>
      </div>
      <div class="analysis-combo" style="margin-top:6px;">${comboLines}</div>
    </div>`;
  }

  const completeGroups = groupByBlade(complete);
  const nearMissGroups = groupByBlade(nearMiss);

  const totalOwned = ownedR.size+ownedB.size+ownedA.size;
  const hasAny = (inv.ownedBlades||[]).length>0 || totalOwned>0;

  document.getElementById("vaultTabContent").innerHTML = `
    <div class="analysis-summary">
      <div class="summary-card complete"><div class="summary-num">${complete.length}</div><div class="summary-label">✅ 可完整組合</div></div>
      <div class="summary-card near"><div class="summary-num">${nearMiss.length}</div><div class="summary-label">🔧 接近達成組合</div></div>
    </div>
    ${!hasAny?'<div class="analysis-empty">📦 請先在「零件倉庫」勾選原裝陀螺或散件零件</div>':''}
    ${completeGroups.length>0?`<div style="font-size:0.75rem;color:var(--success);font-weight:700;margin-bottom:8px;">✅ 可完整組合</div>${completeGroups.map(g=>groupHtml(g,true)).join('')}`:''}
    ${nearMissGroups.length>0?`<div style="font-size:0.75rem;color:var(--warn);font-weight:700;margin:14px 0 8px;">🔧 接近達成組合</div>${nearMissGroups.map(g=>groupHtml(g,false)).join('')}`:''}
    ${completeGroups.length===0&&nearMissGroups.length===0&&hasAny?'<div class="analysis-empty">目前收藏的零件還無法湊成任何建議配置<br>繼續收集吧！</div>':''}`;
}

buildCatTabs();
buildTierFilter();
buildBuyFilter();

// 背景預載特殊主題，進分享頁時直接用快取
loadSpecialThemes();

loadData();

document.getElementById('searchInput').addEventListener('input', function(e) {
  document.getElementById('clearSearchBtn').style.display = e.target.value ? 'block' : 'none';
  render();
});
</script>
