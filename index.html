<style>
:root {
  --bg: #0a0b10;
  --surface: #12151d;
  --surface2: #161b25;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f4f6fb;
  --muted: #7a8aaa;
  --accent: #12efce;
  --accent-rgb: 18, 239, 206;
  --accent-2: #69a7ff;
  --warn: #ffb830;
  --danger: #ff5e7a;
  --success: #7adf60;
  --shadow: 0 12px 30px rgba(0,0,0,0.4);
  --radius-card: 14px;
  --radius-modal: 22px;
  --radius-pill: 999px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  background: #0a0b10 !important;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top left,  rgba(18,239,206,0.26), transparent 52%),
    radial-gradient(circle at top right, rgba(105,167,255,0.22), transparent 46%);
  pointer-events: none;
  z-index: 0;
}
@media (max-width: 600px) {
  body::before {
    background:
      radial-gradient(circle at top left,  rgba(18,239,206,0.26), transparent 60%),
      radial-gradient(circle at top right, rgba(105,167,255,0.22), transparent 55%);
  }
}
header, #main, .modal-overlay { position: relative; z-index: 1; }

header {
  padding: 1.8rem 2rem 1rem;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: linear-gradient(to bottom, rgba(10,11,16,0.95), rgba(10,11,16,0.72), transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 100;
}
.header-top { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.3rem; 
  font-weight: 900;
  letter-spacing: 0.05em; 
  text-transform: uppercase; 
  transform: skewX(-8deg);
  background: linear-gradient(90deg, #99ff00 0%, #ffffff 50%, #55d4ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 0;
  line-height: 1.1;
}
.subtitle { display: inline-flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.st-main { font-size: 1.05rem; font-weight: 900; color: var(--muted); letter-spacing: 0.1em; margin-right: 6px; }
.st-date { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.05em; opacity: 0.8; white-space: nowrap; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
#searchInput {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 999px; color: var(--text);
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.88rem;
  padding: 10px 18px; width: 240px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
#searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(18,239,206,0.1); }
#searchInput::placeholder { color: var(--muted); }

.cat-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border-radius: var(--radius-pill); padding: 4px; border: 1px solid var(--border); box-sizing: border-box; backdrop-filter: blur(8px); }
.cat-tab {
  background: none; border: none; border-radius: var(--radius-pill);
  color: var(--muted); cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;
  padding: 5px 14px; transition: all 0.18s; text-transform: uppercase;
  text-align: center;
}
.cat-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.cat-tab.active { background: var(--surface2); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

.buy-filter { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border-radius: var(--radius-pill); padding: 4px; border: 1px solid var(--border); box-sizing: border-box; backdrop-filter: blur(8px); }
.bfbtn {
  background: none; border: none;
  border-radius: var(--radius-pill); color: var(--muted); cursor: pointer;
  font-size: 0.75rem; font-weight: 500; padding: 4px 12px; transition: all 0.18s;
}
.bfbtn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.bfbtn.active { border: none; color: var(--text); background: var(--surface2); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

.tier-filter { display: flex; gap: 4px; flex-wrap: nowrap; width: 100%; background: rgba(255,255,255,0.04); border-radius: var(--radius-pill); padding: 4px; border: 1px solid var(--border); box-sizing: border-box; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tfbtn {
  flex: 1;
  background: none; border: none;
  border-radius: var(--radius-pill); color: var(--muted); cursor: pointer;
  font-family: 'Roboto', sans-serif;
  font-size: 0.7rem; font-weight: 700; letter-spacing: -0.5px;
  padding: 5px 0; transition: all 0.18s; text-transform: uppercase;
  text-align: center;
  min-width: 0;
}
.tfbtn:hover { color: var(--text); background: rgba(255,255,255,0.07); }
.tfbtn.active { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

.legend { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: 0.7rem; color: var(--muted); margin-top: 6px; justify-content: flex-start; width: 100%; box-sizing: border-box; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.ldot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.source-note { display: block; font-size: 0.65rem; color: var(--muted); margin-top: 8px; opacity: 0.7; text-align: left; width: 100%; box-sizing: border-box; }
.source-note a { color: #5588bb; text-decoration: none; }

main { padding: 1.2rem 2rem 4rem; }

.tier-section {
  display: flex; margin-bottom: 6px;
  border-radius: var(--radius-card); overflow: hidden;
  border: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.008));
  box-shadow: var(--shadow);
  transition: box-shadow 0.2s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.tier-label {
  display: flex; align-items: center; justify-content: center;
  min-width: 54px; flex-shrink: 0;
  font-family: 'Roboto', sans-serif;
  font-size: 1.5rem; font-weight: 900;
}
.tier-cards {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 8px 10px; background: transparent;
  flex: 1; align-items: center; min-height: 84px;
}

.bey-card {
  display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(160deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; cursor: pointer; padding: 8px 7px 6px;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s, background 0.18s;
  width: 80px; text-align: center; position: relative;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 16px rgba(0,0,0,0.2);
}
.bey-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.22); box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06); }

.bey-card::before {
  content: "";
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  border-radius: 999px;
  pointer-events: none;
}

.card-img { width: 50px; height: 50px; object-fit: contain; border-radius: 4px; background: transparent; }
.card-img-ph {
  width: 50px; height: 50px; border-radius: 4px; background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.58rem; color: var(--muted); text-align: center; line-height: 1.3; padding: 4px;
}
.card-name { font-size: 0.63rem; font-weight: 700; color: var(--text); margin-top: 4px; line-height: 1.2; word-break: break-all; }
.card-sub  { font-size: 0.57rem; color: var(--muted); margin-top: 1px; word-break: break-all; }

.buy-dot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; }
.buy-dot.yes   { background: #7adf60; }
.buy-dot.maybe { background: #ffb830; }
.buy-dot.no    { background: #445566; }

.type-pill { font-size: 0.52rem; padding: 2px 7px; border-radius: var(--radius-pill); margin-top: 3px; font-weight: 600; letter-spacing: 0.03em; }
.tp-attack  { background: rgba(255,68,102,0.15);  color: #ff8899; }
.tp-assist  { background: rgba(255,182,214,0.15);  color: #ffb6d6; }
.tp-stamina { background: rgba(64,212,192,0.13);  color: #40d4c0; }
.tp-defense { background: rgba(56,176,240,0.13);  color: #38b0f0; }
.tp-balance { background: rgba(255,184,48,0.13);  color: #ffb830; }
.tp-ratchet { background: rgba(136,112,255,0.13); color: #9988ff; }
.tp-bit     { background: rgba(200,232,64,0.13);  color: #aacc44; }
.tp-special { background: rgba(255,122,43,0.13);  color: #ff9944; }


.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; padding: 1rem; animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: linear-gradient(160deg, rgba(255,255,255,0.07) 0%, rgba(10,11,16,0.55) 100%);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--radius-modal); padding: 1.5rem; max-width: 420px; width: 100%;
  position: relative; animation: slideUp 0.2s ease;
  max-height: 78vh; overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
  scrollbar-width: none;
}
.modal-box::-webkit-scrollbar { display: none; }

@media (min-width: 768px) {
  .modal-box { max-height: 88vh; }
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-close, .modal-back { position: absolute; top: 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; transition: all 0.18s; border-radius: 999px; padding: 0; }
.modal-close { right: 14px; }
.modal-back { left: 14px; }
.modal-close:hover, .modal-back:hover { color: var(--text); background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
.modal-img-wrap {
  width: 154px; height: 154px;
  margin: 0 auto 1rem;
  border-radius: 50%;
  position: relative;
  background:
    radial-gradient(circle at center, rgba(18,239,206,0.18) 0%, rgba(105,167,255,0.12) 40%, transparent 70%);
  display: flex; align-items: center; justify-content: center;
  overflow: visible;
}
.modal-img {
  width: 110px; height: 110px;
  object-fit: contain;
  position: relative; z-index: 1;
  filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45));
}
.modal-img-ph {
  width: 110px; height: 110px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 0.75rem; text-align: center; padding: 8px;
  position: relative; z-index: 1;
}
.modal-tier-badge { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 900; padding: 4px 16px; border-radius: var(--radius-pill); letter-spacing: 0.07em; margin-bottom: 0.4rem; }
.modal-name { font-family: 'Roboto', sans-serif; font-size: 1.45rem; font-weight: 700; margin-bottom: 0.15rem; }
.modal-id   { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.8rem; }
.modal-row  { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 8px 10px; border-bottom: 1px solid var(--border); border-radius: 0; }
.modal-row:first-of-type { border-top: 1px solid var(--border); }
.modal-row:last-of-type { border-bottom: none; }
.modal-label { color: var(--muted); }
.modal-val   { font-weight: 500; }
.buy-rec { margin-top: 0.6rem; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600; line-height: 1.4; display: inline-flex; align-items: center; gap: 6px; }
.buy-rec.yes   { background: rgba(122,223,96,0.08);  color: var(--success); border: 1px solid rgba(122,223,96,0.2); }
.buy-rec.maybe { background: rgba(255,184,48,0.08);  color: var(--warn);    border: 1px solid rgba(255,184,48,0.2); }
.buy-rec.no    { background: rgba(68,85,102,0.12);   color: #8899aa;        border: 1px solid rgba(68,85,102,0.22); }

.parts-products-wrapper { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--border); text-align: left; }
.parts-products-title { display: flex; align-items: center; font-size: 0.85rem; color: var(--accent); margin-bottom: 10px; font-weight: 700; }
.parts-products-title::before { content: ""; display: block; width: 2px; height: 14px; background: var(--accent); border-radius: 1px; margin-right: 6px; }
.parts-products-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
.parts-products-scroll::-webkit-scrollbar { height: 6px; }
.parts-products-scroll::-webkit-scrollbar-thumb { background-color: var(--muted); border-radius: 10px; }
.product-mini-card { flex: 0 0 70px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)); padding: 8px 6px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
.product-mini-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
.product-mini-img { width: 44px; height: 44px; object-fit: contain; border-radius: 4px; background: #0d0d14; margin-bottom: 4px; }
.product-mini-ph { width: 44px; height: 44px; border-radius: 4px; background: #151520; display: flex; align-items: center; justify-content: center; font-size: 0.5rem; color: var(--muted); margin-bottom: 4px; text-align:center; padding:2px; }
.product-mini-name { font-size: 0.6rem; color: var(--text); font-weight: 600; text-align: center; width:100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
.product-mini-id { font-size: 0.55rem; color: var(--muted); text-align: center; margin-top: 1px; }

.clickable-part { color: #f0f0f5; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(255,255,255,0.3); transition: color 0.15s; }
.clickable-part:hover { color: var(--accent); text-decoration-color: var(--accent); }

.empty { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }

@media (max-width: 600px) {
  main { padding: 0.5rem 0.5rem 4rem; }
  header { padding: 0.6rem 0.8rem; }
  .header-top { margin-bottom: 0.5rem; gap: 0.5rem; align-items: center; }
  h1 { font-size: 1.6rem; transform: skewX(-8deg); }
  .st-main { font-size: 0.9rem; } .st-date { font-size: 0.65rem; }
  .vault-inner { padding: 0 16px 80px; }
  .vault-header { margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  
  #searchInput { 
    width: 100%; 
    padding: 12px 18px;
    font-size: 16px;
    border-radius: 999px;
  }
  
  .controls-container {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
    max-width: 100% !important;
    gap: 8px !important;
  }
  
  .top-filter-row {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
    align-items: stretch !important;
    gap: 8px !important;
  }
  
  .top-filter-row > div:first-child {
    max-width: 100% !important;
    width: 100% !important;
  }
  
  .cat-tabs {
    width: 100% !important;
    display: flex !important;
    box-sizing: border-box;
  }
  .cat-tab {
    flex: 1 !important;
    padding: 6px 0 !important;
    text-align: center !important;
  }
  
  .buy-filter {
    width: 100% !important;
    display: flex !important;
    box-sizing: border-box;
  }
  .bfbtn {
    flex: 1 !important;
    padding: 6px 0 !important;
    text-align: center !important;
    font-size: 0.75rem !important;
  }
  
  .tier-filter {
    width: 100% !important;
    display: flex !important;
    flex-wrap: nowrap !important;
    gap: 2px !important;
    box-sizing: border-box;
    margin-bottom: 0 !important;
  }
  .tfbtn {
    flex: 1 !important;
    padding: 6px 0 !important;

    letter-spacing: -0.5px !important;

    text-align: center !important;
  }

  .tier-cards {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)) !important;
    gap: 6px !important;
    padding: 6px !important;
  }
  .bey-card {
    width: 100% !important;
    box-sizing: border-box;
  }

  /* ── PATCH 3: 原裝陀螺卡片手機版填滿 4 欄 ── */
  .owned-blades-grid {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 6px !important;
  }
  .owned-blade-card {
    width: 100% !important;
    box-sizing: border-box;
  }

  .legend {

  }

    text-align: center !important;
  }

/* ── 右下角懸浮島 ── */
.float-island {
  position: fixed;
  bottom: 35px; right: 35px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.5),
    0 0 0 0.5px rgba(255,255,255,0.05);
}
.float-island::before {
  content: "";
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  border-radius: 999px;
}

@media (max-width: 600px) {
  .float-island {
    bottom: max(-8px, calc(env(safe-area-inset-bottom) + 2px));
    right: 8px;
  }
}

.fi-btn {
  position: relative;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: none;
  border: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  color: rgba(255,255,255,0.35);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.18s, background 0.18s;
}
.fi-btn:focus { outline: none; background: none; }
.fi-btn:focus:not(:hover) { background: none; }
.fi-btn:active { background: rgba(255,255,255,0.07); }
.fi-btn:hover {
  color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.07);
}
.fi-btn--active {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.9);
  box-shadow: 0 2px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
}
.fi-btn--locked {
  cursor: default;
  color: rgba(255,255,255,0.18);
}
.fi-btn--locked:hover {
  color: rgba(255,255,255,0.25);
  background: none;
}
.fi-lock-dot {
  position: absolute;
  bottom: 7px; right: 7px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.1);
}

html, body { scrollbar-width: none; background: #0a0b10; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

/* ── 倉庫全頁面 ── */
.vault-page {
  position: fixed; top: 0; left: 0; right: 0;
  height: 100dvh;
  z-index: 300;
  background:
    radial-gradient(circle at top left,  rgba(18,239,206,0.22), transparent 48%),
    radial-gradient(circle at top right, rgba(105,167,255,0.18), transparent 42%),
    var(--bg);
  overflow-y: auto; scrollbar-width: none;
  overflow-anchor: none;
  display: none;
  -webkit-overflow-scrolling: touch;
}
.vault-page.active { display: block; }
.vault-page::-webkit-scrollbar { display: none; }
.vault-page::before { display: none; }
.vault-inner { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 16px 80px; }
.vault-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 14px; gap: 12px; position: sticky; top: 0; z-index: 5;
  margin: 0 -16px; padding-left: 16px; padding-right: 16px;
  background: linear-gradient(to bottom, rgba(10,11,16,0.98) 60%, rgba(10,11,16,0.7) 85%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.vault-title-wrap { display: flex; flex-direction: column; gap: 1px; }
.vault-title {
  font-family: 'Orbitron', sans-serif; font-size: 1.5rem;
  font-weight: 900; letter-spacing: 0.06em; line-height: 1;
  background: linear-gradient(90deg, #9dfd65, #fff 50%, #69d9ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-transform: uppercase;
  transform: skewX(-8deg); display: inline-block;
}
.vault-subtitle { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; font-weight: 400; }
.vault-close {
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  color: var(--muted); cursor: pointer; border-radius: 999px;
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
}
.vault-close:hover { color: var(--text); background: rgba(255,255,255,0.12); }

.vault-lock {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 75vh; gap: 16px; text-align: center;
}
.vault-lock-icon { font-size: 3rem; }
.vault-lock h2 { font-size: 1.2rem; font-weight: 700; margin: 0; }
.vault-lock p { color: var(--muted); font-size: 0.85rem; margin: 0; }
.vault-pw-input {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 999px; color: var(--text); font-size: 1rem;
  padding: 12px 20px; width: 220px; outline: none; text-align: center; letter-spacing: 0.2em;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.vault-pw-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(18,239,206,0.1); }
.vault-pw-btn {
  background: linear-gradient(135deg, rgba(18,239,206,0.18), rgba(105,167,255,0.12));
  border: 1px solid rgba(18,239,206,0.3); border-radius: 999px;
  color: var(--accent); font-weight: 700; font-size: 0.9rem;
  padding: 10px 28px; cursor: pointer; transition: all 0.18s;
}
.vault-pw-btn:hover { box-shadow: 0 0 16px rgba(18,239,206,0.2); }
.vault-pw-error { color: var(--danger); font-size: 0.8rem; min-height: 1.2em; }

.vault-tabs {
  display: flex; gap: 3px;
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-pill); padding: 3px; border: 1px solid rgba(255,255,255,0.07);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  margin-bottom: 16px;
}
.vault-tab {
  flex: 1; background: none; border: 1px solid transparent; border-radius: var(--radius-pill);
  color: rgba(255,255,255,0.38); cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.88rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  padding: 7px 0; transition: all 0.2s; text-align: center;
}
.vault-tab:hover { color: rgba(255,255,255,0.65); background: rgba(255,255,255,0.04); }
.vault-tab.active {
  background: linear-gradient(160deg, rgba(18,239,206,0.12), rgba(18,239,206,0.05));
  border: 1px solid rgba(18,239,206,0.22);
  color: var(--accent);
  box-shadow: inset 0 1px 0 rgba(18,239,206,0.15), 0 2px 10px rgba(18,239,206,0.08);
}

.vault-section {
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-card);
  margin-bottom: 10px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.vault-section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 10px;
}
.vault-section-title { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #d5def1; }
.vault-section-count { font-size: 0.75rem; color: var(--muted); }
.vault-parts-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
.vault-part-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600;
  cursor: pointer; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04); color: var(--muted); transition: all 0.15s;
}
.vault-part-chip:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.vault-part-chip.owned { background: rgba(18,239,206,0.1); border-color: rgba(18,239,206,0.3); color: var(--accent); }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; }
.vault-part-chip.owned .chip-dot { background: var(--accent); }

.analysis-summary {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
.summary-card {
  padding: 14px 16px; border-radius: var(--radius-card); border: 1px solid var(--border);
  text-align: center; backdrop-filter: blur(8px);
}
.summary-card.complete { background: rgba(122,223,96,0.07); border-color: rgba(122,223,96,0.2); }
.summary-card.near    { background: rgba(255,184,48,0.07);  border-color: rgba(255,184,48,0.2); }
.summary-num { font-size: 2rem; font-weight: 900; line-height: 1; }
.summary-card.complete .summary-num { color: var(--success); }
.summary-card.near    .summary-num { color: var(--warn); }
.summary-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
.analysis-item {
  background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
  border: 1px solid var(--border); border-radius: var(--radius-card);
  padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  transition: border-color 0.15s, transform 0.15s; backdrop-filter: blur(6px);
}
.analysis-item:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
.analysis-item-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.analysis-name { font-size: 0.9rem; font-weight: 700; }
.analysis-id { font-size: 0.72rem; color: var(--muted); }
.analysis-combo { font-size: 0.78rem; color: var(--muted); line-height: 1.8; }
.analysis-combo .have { color: var(--success); }
.analysis-combo .missing { color: var(--warn); font-weight: 700; }
.analysis-empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.85rem; }

.vault-notice {
  position: relative;
  margin-bottom: 14px;
  padding: 12px 40px 12px 14px;
  background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  font-size: 0.82rem; color: var(--text); line-height: 1.5;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  animation: fadeIn 0.3s ease;
}
.vault-notice-close {
  position: absolute; top: 8px; right: 8px;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all 0.15s; line-height: 1;
}
.vault-notice-close:hover { background: rgba(255,255,255,0.15); color: var(--text); }

.owned-blades-grid {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 4px 0;
}

.vault-subtabs {
  display: flex; gap: 3px; margin-bottom: 14px;
  background: rgba(255,255,255,0.03); border-radius: var(--radius-pill);
  padding: 3px; border: 1px solid rgba(255,255,255,0.07);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.vault-subtab {
  flex: 1; background: none; border: 1px solid transparent; border-radius: var(--radius-pill);
  color: rgba(255,255,255,0.38); cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 6px 0; transition: all 0.2s; text-align: center;
}
.vault-subtab:hover { color: rgba(255,255,255,0.65); background: rgba(255,255,255,0.04); }
.vault-subtab.active {
  background: linear-gradient(160deg, rgba(18,239,206,0.12), rgba(18,239,206,0.05));
  border: 1px solid rgba(18,239,206,0.22);
  color: var(--accent);
  box-shadow: inset 0 1px 0 rgba(18,239,206,0.15), 0 2px 10px rgba(18,239,206,0.08);
}

.owned-blade-card {
  display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(160deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; cursor: pointer; padding: 8px 7px 6px;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  width: 80px; text-align: center; position: relative;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 16px rgba(0,0,0,0.25);
}
.owned-blade-card::before {
  content: ""; position: absolute; top: 0; left: 10%; right: 10%;
  height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  border-radius: 999px; pointer-events: none;
}
.owned-blade-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.22); box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06); }
.owned-blade-card.owned { border-color: rgba(18,239,206,0.45); background: linear-gradient(160deg, rgba(18,239,206,0.12), rgba(18,239,206,0.04)); }
.owned-blade-thumb { width: 50px; height: 50px; flex-shrink: 0; object-fit: contain; background: transparent; }
.owned-blade-thumb-ph { width: 50px; height: 50px; flex-shrink: 0; background: rgba(255,255,255,0.04); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; color: var(--muted); text-align: center; }
.owned-blade-info { width: 100%; }
.owned-blade-name { font-size: 0.63rem; font-weight: 700; color: var(--text); line-height: 1.2; margin-top: 4px; word-break: break-all; }
.owned-blade-id { font-size: 0.57rem; color: var(--muted); margin-top: 1px; word-break: break-all; }
.owned-blade-parts { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; justify-content: center; }
.part-tag { display: inline-block; padding: 1px 5px; border-radius: 999px; font-size: 0.55rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }
.owned-blade-card.owned .part-tag { background: rgba(18,239,206,0.08); border-color: rgba(18,239,206,0.2); color: rgba(18,239,206,0.8); }
.owned-blade-check {
  position: absolute; top: 5px; right: 5px;
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; background: rgba(0,0,0,0.2);
}
.owned-blade-card.owned .owned-blade-check { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(18,239,206,0.4); }

/* 已有總覽的卡片用藍青色 #3dcbe7 區別全站青綠 */
.owned-blade-card.overview-card {
  border-color: rgba(61,203,231,0.4);
  background: linear-gradient(160deg, rgba(61,203,231,0.1), rgba(61,203,231,0.03));
  box-shadow: inset 0 1px 0 rgba(61,203,231,0.15), 0 4px 16px rgba(0,0,0,0.25);
}
.owned-blade-card.overview-card .part-tag {
  background: rgba(61,203,231,0.08); border-color: rgba(61,203,231,0.22); color: #3dcbe7;
}
.owned-blade-card.overview-card .owned-blade-name { color: #e8f8fc; }
.owned-blade-card.overview-card {
  border-color: rgba(61,203,231,0.4);
  background: linear-gradient(160deg, rgba(61,203,231,0.1), rgba(61,203,231,0.03));
  box-shadow: inset 0 1px 0 rgba(61,203,231,0.15), 0 4px 16px rgba(0,0,0,0.25);
}
.owned-blade-card.overview-card .part-tag {
  background: rgba(61,203,231,0.08); border-color: rgba(61,203,231,0.22); color: #3dcbe7;
}
.owned-blade-card.overview-card .owned-blade-name { color: #e8f8fc; }

.vault-part-chip.from-blade { background: rgba(18,239,206,0.04); border-color: rgba(18,239,206,0.12); color: rgba(18,239,206,0.55); cursor: default; }
.vault-part-chip.from-blade:hover { border-color: rgba(18,239,206,0.12); transform: none; color: rgba(18,239,206,0.55); }
.chip-source { font-size: 0.58rem; opacity: 0.65; margin-left: 2px; }
/* ── 分享頁面 ── */
.share-page {
  position: fixed; top: 0; left: 0; right: 0;
  height: 100dvh;
  z-index: 350;
  background:
    radial-gradient(circle at top left,  rgba(18,239,206,0.22), transparent 48%),
    radial-gradient(circle at top right, rgba(105,167,255,0.18), transparent 42%),
    var(--bg);
  overflow-y: auto; scrollbar-width: none;
  overflow-anchor: none;
  display: none;
}
.share-page.active { display: block; }
.share-page::-webkit-scrollbar { display: none; }
.share-page::before { display: none; }
.share-inner { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
.share-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 14px; position: sticky; top: 0; z-index: 5;
  margin: 0 -16px; padding-left: 16px; padding-right: 16px;
  background: linear-gradient(to bottom, rgba(10,11,16,0.98) 60%, rgba(10,11,16,0.7) 85%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.share-title-wrap { display: flex; flex-direction: column; gap: 1px; }
.share-title {
  font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900;
  letter-spacing: 0.06em; line-height: 1; text-transform: uppercase;
  background: linear-gradient(90deg, #9dfd65, #fff 50%, #69d9ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  transform: skewX(-8deg); display: inline-block;
}
.share-subtitle { font-size: 0.72rem; color: var(--muted); }

/* 背景選色 — 單行橫向滑動 */
.bg-options { display: flex; gap: 10px; flex-wrap: nowrap; overflow-x: auto; margin-bottom: 16px; padding: 5px 5px 10px 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab; }
.bg-options::-webkit-scrollbar { display: none; }
.bg-options.dragging { cursor: grabbing; }
.bg-opt {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; cursor: pointer;
  border: none; outline: none; transition: all 0.2s;
  position: relative; padding: 0;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
}
.bg-opt.active {
  box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9), 0 0 0 3.5px rgba(255,255,255,0.15);
  transform: scale(1.1);
}
.bg-opt:hover:not(.active) { transform: scale(1.06); }

/* 陀螺選擇區 */
.combo-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px;
}
.combo-slot {
  background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
  padding: 12px 10px; text-align: center; cursor: pointer;
  transition: all 0.18s; min-height: 110px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  backdrop-filter: blur(8px);
}
.combo-slot:hover { border-color: rgba(255,255,255,0.22); transform: translateY(-2px); }
.combo-slot.filled { border-color: rgba(18,239,206,0.35); background: linear-gradient(160deg, rgba(18,239,206,0.08), rgba(18,239,206,0.02)); }
.combo-slot img { width: 60px; height: 60px; object-fit: contain; }
.combo-slot-name { font-size: 0.7rem; font-weight: 700; color: var(--text); line-height: 1.2; }
.combo-slot-id { font-size: 0.6rem; color: var(--muted); }
.combo-slot-empty { font-size: 0.75rem; color: var(--muted); }
.combo-slot-num { font-size: 0.6rem; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }

/* 搜尋選陀螺 modal */
.blade-picker {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.18s ease;
  touch-action: none;
}
.blade-picker-box {
  background: linear-gradient(180deg, var(--surface2), var(--surface));
  border: 1px solid rgba(255,255,255,0.12); border-radius: 22px 22px 0 0;
  width: 100%; max-width: 680px;
  height: 55dvh; min-height: 200px;
  display: flex; flex-direction: column;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
  animation: slideUp 0.22s ease;
}
.blade-picker-head { padding: 16px 16px 10px; flex-shrink: 0; }
.blade-picker-title { font-size: 0.85rem; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.blade-picker-search {
  width: 100%; padding: 10px 16px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
  color: var(--text); font-size: 16px; outline: none; box-sizing: border-box;
  font-family: 'Noto Sans TC', sans-serif; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.blade-picker-search:focus { border-color: var(--accent); }
.blade-picker-list { overflow-y: auto; padding: 8px 12px 20px; flex: 1; min-height: 0; scrollbar-width: none; touch-action: pan-y; overscroll-behavior: contain; }
.blade-picker-list::-webkit-scrollbar { display: none; }
.blade-picker-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px; border-radius: 12px; cursor: pointer;
  transition: background 0.15s;
}
.blade-picker-item:hover { background: rgba(255,255,255,0.07); }
.blade-picker-item img { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
.blade-picker-item-ph { width: 44px; height: 44px; border-radius: 8px; background: rgba(255,255,255,0.06); flex-shrink: 0; }
.blade-picker-item-info { flex: 1; }
.blade-picker-item-name { font-size: 0.85rem; font-weight: 700; color: var(--text); }
.blade-picker-item-id { font-size: 0.72rem; color: var(--muted); }

/* 使用者輸入 */
.share-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.share-input {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; color: var(--text); font-size: 16px;
  padding: 10px 14px; outline: none; font-family: 'Noto Sans TC', sans-serif;

<script>
let DB = [];
let modalHistory = [];
let currentModalData = null;
let IMG = {};
let PARTS_IMG = {};

const sheetUrl = "https://docs.google.com/spreadsheets/d/1TBHOpcsv25bBfWERq14CBIy4P1G7j-qpPhmclx_nTWI/gviz/tq?tqx=out:csv";
const partsSheetUrl = sheetUrl + "&sheet=零件圖鑑";

function extractDateOnly(dateStr) {
  if (!dateStr) return "未知日期 更新";
  const match = dateStr.match(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/);
  return match ? match[0] + " 更新" : dateStr;
}

async function fetchBothSheets() {
  const t = new Date().getTime();
  const [resMain, resParts] = await Promise.all([
    fetch(sheetUrl + "&_=" + t),
    fetch(partsSheetUrl + "&_=" + t)
  ]);
  const [csvMain, csvParts] = await Promise.all([
    resMain.text(),
    resParts.text()
  ]);
  return { dataMain: parseCSV(csvMain), dataParts: parseCSV(csvParts) };
}

function parseCSV(str) {
  const arr = [];
  let quote = false;
  let col, c;
  for (let row = col = c = 0; c < str.length; c++) {
    const cc = str[c], nc = str[c+1];
    arr[row] = arr[row] || [];
    arr[row][col] = arr[row][col] || '';
    if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
    if (cc == '"') { quote = !quote; continue; }
    if (cc == ',' && !quote) { ++col; continue; }
    if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
    if (cc == '\n' && !quote) { ++row; col = 0; continue; }
    if (cc == '\r' && !quote) { ++row; col = 0; continue; }
    arr[row][col] += cc;
  }
  return arr;
}

async function loadData(force = false) {
  const cachedDB = localStorage.getItem('bey_db_v2');
  const cachedIMG = localStorage.getItem('bey_img_v2');
  const cachedPartsIMG = localStorage.getItem('bey_parts_img_v2');
  const cachedDate = localStorage.getItem('bey_date_v2');

  if (!force && cachedDB && cachedIMG && cachedPartsIMG && cachedDate) {
      DB = JSON.parse(cachedDB);
      IMG = JSON.parse(cachedIMG);
      PARTS_IMG = JSON.parse(cachedPartsIMG);
      
      const dateEl = document.getElementById('updateDateDisplay');
      dateEl.textContent = extractDateOnly(cachedDate);
      dateEl.style.cursor = "default";
      dateEl.onclick = null;
      
      render(); 
      backgroundCheck(cachedDate);
  } else {
      const msg = force ? "🔄 強制同步最新資料中..." : "⚙️ 初次載入天梯資料中...";
      document.getElementById("main").innerHTML = `<div style="text-align:center; padding:80px; color:#99ff00; font-weight:bold; font-size:1.0rem;">${msg}</div>`;
      if (force) {
          localStorage.removeItem('bey_db_v2');
          localStorage.removeItem('bey_img_v2');
          localStorage.removeItem('bey_parts_img_v2');
          localStorage.removeItem('bey_date_v2');
      }
      await fetchAndProcess();
  }
}

async function backgroundCheck(currentCachedDate) {
  try {
      const res = await fetch(sheetUrl + "&_=" + new Date().getTime());
      const csvText = await res.text();
      const data = parseCSV(csvText);
      
      let latestDate = "未知日期 更新";
      if (data[0] && data[0][14]) {
          latestDate = data[0][14].trim() + " 更新";
      }
      
      if (latestDate && latestDate !== currentCachedDate) {
          const dateEl = document.getElementById("updateDateDisplay");
          dateEl.innerHTML = `<span style="color:#99ff00; font-weight:700;"><span id="refreshIcon" style="display:inline-block; transition:transform 0.5s ease;">🔄</span> 點擊更新資料</span>`;
          dateEl.style.cursor = "pointer";
          
          dateEl.onclick = () => {
              const rIcon = document.getElementById("refreshIcon");
              if (rIcon) rIcon.style.transform = "rotate(360deg)";
              
              setTimeout(async () => {
                  const fullData = await fetchBothSheets();
                  processData(fullData.dataMain, fullData.dataParts, latestDate);
              }, 400);
          };
      }
  } catch (e) {
      console.log("背景檢查更新失敗 (可能處於離線狀態)", e);
  }
}

async function fetchAndProcess() {
  try {
      const fullData = await fetchBothSheets();
      
      let latestDate = "未知日期 更新";
      if (fullData.dataMain[0] && fullData.dataMain[0][14]) {
          latestDate = fullData.dataMain[0][14].trim() + " 更新";
      }
      
      processData(fullData.dataMain, fullData.dataParts, latestDate);
  } catch (e) {
      document.getElementById("main").innerHTML = `<div style="text-align:center; padding:50px; color:#ff4d4d; font-weight:bold;">❌ 讀取資料失敗<br><span style="font-size:0.9rem;color:var(--muted); font-weight:normal;">請確認網路連線。</span></div>`;
  }
}

function processData(dataMain, dataParts, latestDate) {
  DB = [];
  IMG = {};
  PARTS_IMG = {};
  
  if (dataParts && dataParts.length > 0) {
      let headRow = dataParts[0].map(h => (h||"").trim().toLowerCase());
      let idxId = headRow.findIndex(h => h.includes("型號") || h.includes("名稱") || h.includes("name"));
      let idxImg = headRow.findIndex(h => h.includes("圖片") || h.includes("img") || h.includes("url"));
      
      if(idxId === -1) idxId = 0;
      if(idxImg === -1) idxImg = 2;

      for (let i = 1; i < dataParts.length; i++) {
          const row = dataParts[i];
          if (!row || !row[idxId]) continue;
          const pid = row[idxId].trim();
          const pImg = row[idxImg] ? row[idxImg].trim() : "";
          if (pid && pImg) {
              PARTS_IMG[pid] = pImg;
          }
      }
  }
  
  const partAggregator = {};

  for (let i = 1; i < dataMain.length; i++) {
      const row = dataMain[i];
      if (!row || row.length < 5 || !row[0]) continue;
      
      const id = row[0].trim();
      const name = row[1].trim();
      const cat = row[2].trim() || "blade";
      const type = row[3].trim() || "attack";
      const tier = row[4].trim() || "-";
      const manualBuy = row[5] ? row[5].trim().toLowerCase() : "";
      const ratchet = row[6] ? row[6].trim() : "";
      const ratchetTier = row[7] ? row[7].trim() : "";
      const bit = row[8] ? row[8].trim() : "";
      const bitTier = row[9] ? row[9].trim() : "";
      const assistBlade = row[10] ? row[10].trim() : "";
      const source = row[11] ? row[11].trim() : "";
      const imgUrl = row[12] ? row[12].trim() : "";
      const comboText = row[13] ? row[13].trim() : "";
      const noteText = row[14] ? row[14].trim() : "";
      
      if (imgUrl) IMG[id.split(" ")[0]] = imgUrl; 

      let finalBuy = "no";
      if (["yes", "maybe", "no"].includes(manualBuy)) {
          finalBuy = manualBuy;
      } else {
          finalBuy = calculateBuyRec(tier, ratchetTier, bitTier);
      }
      
      const bladeObj = { id, name, cat, type, tier, buy: finalBuy, source, ratchet, ratchetTier, bit, bitTier, assistBlade, comboText, noteText };

      if (tier) {
          DB.push(bladeObj);
      }

      if (ratchet && ratchetTier) {
          if (!partAggregator[ratchet]) {
              partAggregator[ratchet] = {
                  id: ratchet, name: ratchet, cat: "ratchet", type: "ratchet",
                  tier: ratchetTier,
                  buy: getBuyRec(ratchetTier),
                  source: "獨立零件",
                  products: []
              };
          }
          partAggregator[ratchet].products.push(bladeObj);
      }

      if (bit && bitTier) {
          if (!partAggregator[bit]) {
              partAggregator[bit] = {
                  id: bit, name: bit, cat: "bit", type: "bit",
                  tier: bitTier,
                  buy: getBuyRec(bitTier),
                  source: "獨立零件",
                  products: []
              };
          }
          partAggregator[bit].products.push(bladeObj);
      }

      if (assistBlade) {
          const assistId = "輔助" + assistBlade;
          const assistKey = "assist_" + assistBlade;
          if (!partAggregator[assistKey]) {
              partAggregator[assistKey] = {
                  id: assistId, name: assistId, cat: "assist", type: "assist",
                  tier: "-",
                  buy: "no",
                  source: "輔助戰刃",
                  products: []
              };
          }
          partAggregator[assistKey].products.push(bladeObj);
      }
  }

  Object.values(partAggregator).forEach(p => DB.push(p));

  localStorage.setItem('bey_db_v2', JSON.stringify(DB));
  localStorage.setItem('bey_img_v2', JSON.stringify(IMG));
  localStorage.setItem('bey_parts_img_v2', JSON.stringify(PARTS_IMG));
  localStorage.setItem('bey_date_v2', latestDate);
  
  const dateEl = document.getElementById("updateDateDisplay");
  dateEl.textContent = extractDateOnly(latestDate);
  dateEl.style.cursor = "default";
  dateEl.onclick = null;
  
  render();
}

function getBuyRec(t) {
    if (["X", "S+", "S", "A+", "A"].includes(t)) return "yes";
    if (["B+", "B"].includes(t)) return "maybe";
    return "no";
}

function calculateBuyRec(bladeT, ratchetT, bitT) {
    const scores = {
        "X": 100, "S+": 90, "S": 80, "A+": 70, "A": 60,
        "B+": 50, "B": 40, "C+": 30, "C": 20, "D+": 15, "D": 10, "E+": 5, "E": 0
    };
    
    let bScore = scores[bladeT];
    let rScore = scores[ratchetT];
    let bitScore = scores[bitT];

    let totalWeight = 0;
    let totalScore = 0;

    if (bScore !== undefined) { totalScore += bScore * 2; totalWeight += 2; }
    if (rScore !== undefined) { totalScore += rScore * 1; totalWeight += 1; }
    if (bitScore !== undefined) { totalScore += bitScore * 1; totalWeight += 1; }

    if (totalWeight === 0) return "no";

    let avg = totalScore / totalWeight;
    if (avg >= 60) return "yes";
    if (avg >= 40) return "maybe";
    return "no";
}

const BLADE_TIERS   = ["X","S+","S","A+","A","B+","B","C+","C","D+","D","E+","E","-"];
const RATCHET_TIERS = ["X","S","A","B","C","D","E","-"];
const BIT_TIERS     = ["X","S","A","B","C","D","E","-"];

const TIER_COLORS = {
  "X":"#ff4466","S+":"#ff7a2b","S":"#ffb830",
  "A+":"#c8e840","A":"#7adf60",
  "B+":"#40d4c0","B":"#38b0f0",
  "C+":"#8870ff","C":"#b060e0",
  "D+":"#cc5566","D":"#886688",
  "E+":"#556677","E":"#445566"
, "-":"#555"};

const TYPE_LABELS = {attack:"攻擊",stamina:"耐久",defense:"防禦",balance:"均衡",special:"特殊",ratchet:"固鎖",bit:"軸心"};
const TYPE_CLASSES = {attack:"tp-attack",stamina:"tp-stamina",defense:"tp-defense",balance:"tp-balance",special:"tp-special",ratchet:"tp-ratchet",bit:"tp-bit"};
const BUY_LABELS = {yes:"✅ 推薦購買",maybe:"⚠️ 視情況",no:"❌ 不推薦"};
const BUY_DESCS  = {yes:"競技表現優秀，值得投資",maybe:"有一定實用性，視預算考慮",no:"競技環境中表現偏弱，建議跳過"};
const CAT_LABELS = {all:"全部 All",blade:"戰刃 Blade",ratchet:"固鎖 Ratchet",bit:"軸心 Bit"};

let activeCategory = "all";
let activeTier = "all";
let activeBuy  = "all";

function norm(s) {
  if (!s) return "";
  return s.toLowerCase().replace(/-/g, '').replace(/\s+/g, '');
}

function matchSearch(d, q) {
  if (!q) return true;
  const nq = norm(q);
  return norm(d.id).includes(nq)
    || norm(d.name).includes(nq)
    || d.id.toLowerCase().includes(q.toLowerCase())
    || d.name.toLowerCase().includes(q.toLowerCase())
    || (d.ratchet && norm(d.ratchet).includes(nq))
    || (d.bit && norm(d.bit).includes(nq))
    || (d.comboText && norm(d.comboText).includes(nq))
    || (d.noteText && norm(d.noteText).includes(nq));
}

function tiersFor(cat) {
  return (cat==="all" || cat==="blade") ? BLADE_TIERS : cat==="ratchet" ? RATCHET_TIERS : BIT_TIERS;
}

function getImgUrl(d) {
  if ((d.cat === "ratchet" || d.cat === "bit" || d.cat === "assist") && PARTS_IMG[d.id]) {
      return PARTS_IMG[d.id];
  }
  const key = d.id.split(" ")[0];
  if (IMG[key]) return IMG[key];
  const base = key.replace(/-\d+$/, "");
  if (IMG[base]) return IMG[base];
  return "";
}

function buildCatTabs() {
  const el = document.getElementById("catTabs");
  el.innerHTML = "";
  ["all","blade","ratchet","bit"].forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-tab" + (cat===activeCategory?" active":"");
    btn.textContent = CAT_LABELS[cat];
    btn.onclick = () => {
      activeCategory = cat; activeTier = "all";
      document.querySelectorAll(".cat-tab").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      buildTierFilter(); render();
    };
    el.appendChild(btn);
  });
}

function buildTierFilter() {
  const el = document.getElementById("tierFilter");
  el.innerHTML = "";
  const tiers = tiersFor(activeCategory);
  [["all","全部"],...tiers.map(t=>[t, t])].forEach(([val,label]) => {
    const btn = document.createElement("button");
    btn.className = "tfbtn" + (val===activeTier?" active":"");
    const c = TIER_COLORS[val] || "var(--accent)";
    if (val!=="all"){ btn.style.borderColor=c+"55"; btn.style.color=c; }
    btn.textContent = label;
    btn.dataset.tier = val;
    btn.onclick = () => {
      activeTier = val;
      document.querySelectorAll(".tfbtn").forEach(b => {
        b.classList.remove("active"); b.style.background="";
        if (b.dataset.tier!=="all") b.style.color = TIER_COLORS[b.dataset.tier]||"";
        else b.style.color="";
      });
      btn.classList.add("active");
      btn.style.background = val==="all" ? "var(--accent)" : c;
      btn.style.color = "#0a0a0f";
      render();
    };
    if (val === activeTier) {
      btn.style.background = val==="all" ? "var(--accent)" : c;
      btn.style.color = "#0a0a0f";
    }
    el.appendChild(btn);
  });
}

function buildBuyFilter() {
  const el = document.getElementById("buyFilter");
  el.innerHTML = "";
  [["all","全部"],["yes","推薦"],["maybe","視情況"],["no","不推薦"]].forEach(([val,label]) => {
    const btn = document.createElement("button");
    btn.className = "bfbtn"+(val===activeBuy?" active":"");
    btn.textContent = label;
    btn.onclick = () => {
      activeBuy = val;
      document.querySelectorAll(".bfbtn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active"); render();
    };
    el.appendChild(btn);
  });
}

function resetHome() {
  document.getElementById("searchInput").value = "";
  activeCategory = "all";
  activeTier = "all";
  activeBuy = "all";
  buildCatTabs();
  buildTierFilter();
  buildBuyFilter();
  render();
}

function render() {
  const q = document.getElementById("searchInput").value.trim();
  const tiers = tiersFor(activeCategory);

  const filtered = DB.filter(d =>
    (activeCategory==="all" || d.cat===activeCategory) &&
    matchSearch(d,q) &&
    (activeTier==="all" || d.tier===activeTier) &&
    (activeBuy==="all"  || d.buy===activeBuy)
  );

  const main = document.getElementById("main");
  main.innerHTML = "";

  if (!filtered.length) {
    main.innerHTML = `<div class="empty">找不到符合的零件</div>`; return;
  }

  const byTier = {};
  tiers.forEach(t => { byTier[t] = filtered.filter(d=>d.tier===t); });

  tiers.forEach(tier => {
    const items = byTier[tier];
    if (!items || !items.length) return;
    const color = TIER_COLORS[tier]||"#666";

    const sec = document.createElement("div");
    sec.className = "tier-section";

    const label = document.createElement("div");
    label.className = "tier-label";
    label.textContent = tier;
    label.style.cssText = `background:${color}20;color:${color};min-width:54px;`;

    const cards = document.createElement("div");
    cards.className = "tier-cards";

    items.forEach(d => {
      const card = document.createElement("div");
      card.className = "bey-card";
      const imgUrl = getImgUrl(d);

      let displayName = d.name;
      let displaySub = (d.cat === "blade") ? d.id : (d.cat === "ratchet" ? "固鎖 Ratchet" : "軸心 Bit");

      const imgHtml = imgUrl

function linkifyParts(text) {
  if (!text) return "";
  let processed = text.replace(/\|/g, "<br>").replace(/\n/g, "<br>");
  
  const assistParts = DB.filter(x => x.cat === 'assist');
  const ratchetBitParts = DB.filter(x => x.cat === 'ratchet' || x.cat === 'bit');

  const assistIds = [...new Set(assistParts.map(x => x.id))].sort((a, b) => b.length - a.length);
  const partIds = [...new Set(ratchetBitParts.map(x => x.id))].sort((a, b) => b.length - a.length);

  if (assistIds.length === 0 && partIds.length === 0) return processed;

  const allIds = [...assistIds, ...partIds];
  const escaped = allIds.map(id => id.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
  const combinedPattern = new RegExp(`(${escaped.join('|')})`, 'g');

  return processed.split(/(<[^>]+>)/).map(chunk => {
    if (chunk.startsWith('<')) return chunk;
    return chunk.replace(combinedPattern, (match) => {
      const assist = assistParts.find(x => x.id === match);
      if (assist) {
        return `<span class="clickable-part assist-link" data-assist-id="${match}">${match}</span>`;
      }
      const part = ratchetBitParts.find(x => x.id === match);
      if (part) {
        return `<span class="clickable-part" data-id="${part.id}" data-cat="${part.cat}">${match}</span>`;
      }
      return match;
    });
  }).join('');
}

let SPECIAL_THEMES = [];

function getUnlockedIds() {
  try { return JSON.parse(localStorage.getItem('bey_unlocked_themes') || '[]'); }
  catch { return []; }
}
function saveUnlockedId(id) {
  const ids = getUnlockedIds();
  if (!ids.includes(id)) { ids.push(id); localStorage.setItem('bey_unlocked_themes', JSON.stringify(ids)); }
}

async function loadSpecialThemes() {
  if (_specialThemesLoaded) return;
  try {
    const res = await fetch(SPECIAL_THEMES_CSV + '&t=' + Date.now());
    const text = await res.text();
    const rows = text.trim().split('\n').slice(1);
    SPECIAL_THEMES = rows.map(row => {
      const cols = row.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
      const clean = cols.map(c => c.replace(/^"|"$/g,'').trim());
      return { id: clean[0], label: clean[1], code: clean[2], preview_url: clean[3], bg_type: clean[4] };
    }).filter(t => t.id);
    _specialThemesLoaded = true;
  } catch(e) { console.warn('特殊主題載入失敗', e); }
}

function tryUnlockCode(inputCode) {
  const match = SPECIAL_THEMES.find(t => t.code === inputCode.trim());
  if (!match) return false;
  saveUnlockedId(match.id);
  return match;
}

  a.click();
}

function hexToRgba(hex, alpha) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function initBgOptionsScroll() {
  const el = document.querySelector('.bg-options');
  if (!el) return;
  // 滾輪橫向捲動
  el.addEventListener('wheel', e => {
    e.preventDefault();
    el.scrollLeft += e.deltaY || e.deltaX;
  }, { passive: false });
  // 滑鼠拖曳
  let isDown = false, startX, scrollLeft;
  el.addEventListener('mousedown', e => {
    isDown = true; el.classList.add('dragging');
    startX = e.pageX - el.offsetLeft;
    scrollLeft = el.scrollLeft;
  });
  el.addEventListener('mouseleave', () => { isDown = false; el.classList.remove('dragging'); });
  el.addEventListener('mouseup', () => { isDown = false; el.classList.remove('dragging'); });
  el.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    el.scrollLeft = scrollLeft - (e.pageX - el.offsetLeft - startX);
  });
}

  modal.innerHTML = `
    <div style="
      background:var(--surface);border:1px solid var(--border2);
      border-radius:20px;padding:28px 24px;width:100%;max-width:340px;
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
    ">
      <div style="font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:6px;">🔒 解鎖特殊主題</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-bottom:20px;">輸入活動代碼來解鎖限定背景主題</div>
      <input id="unlockCodeInput" type="text" placeholder="輸入代碼…"
        style="width:100%;background:var(--surface2);border:1px solid var(--border2);
          border-radius:12px;color:var(--text);font-size:16px;padding:12px 14px;
          outline:none;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif;
          margin-bottom:8px;"
        onfocus="this.style.borderColor='var(--accent)'"
        onblur="this.style.borderColor='var(--border2)'"
        onkeydown="if(event.key==='Enter')document.getElementById('unlockSubmitBtn').click()">
      <div id="unlockMsg" style="font-size:0.78rem;min-height:20px;margin-bottom:14px;"></div>
      <div style="display:flex;gap:10px;">
        <button onclick="document.getElementById('unlockModal').remove()"
          style="flex:1;padding:11px;border-radius:12px;border:1px solid var(--border2);
            background:none;color:var(--muted);font-size:0.85rem;cursor:pointer;
            font-family:'Noto Sans TC',sans-serif;">取消</button>
        <button id="unlockSubmitBtn" onclick="submitUnlockCode()"
          style="flex:2;padding:11px;border-radius:12px;border:none;
            background:var(--accent);color:#000;font-size:0.85rem;font-weight:700;
            cursor:pointer;font-family:'Noto Sans TC',sans-serif;">解鎖</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  setTimeout(() => document.getElementById('unlockCodeInput')?.focus(), 100);
}

function submitUnlockCode() {
  const input = document.getElementById('unlockCodeInput');
  const msg = document.getElementById('unlockMsg');
  if (!input) return;
  const result = tryUnlockCode(input.value);
  if (result) {
    msg.style.color = 'var(--success)';
    msg.textContent = `✓ 已解鎖「${result.label}」！`;
    shareState.bgId = result.id;
    setTimeout(() => {
      document.getElementById('unlockModal')?.remove();
      renderSharePage();
      renderShareCanvas();
    }, 900);
  } else {
    msg.style.color = 'var(--danger)';
    msg.textContent = '代碼錯誤，請再試一次。';
    input.style.borderColor = 'var(--danger)';
    setTimeout(() => { input.style.borderColor = 'var(--border2)'; }, 1200);
  }
}

async function renderShareCanvas() {
  // 確保 canvas 存在
  const wrap = document.querySelector('.share-preview-wrap');
  if (!wrap) return;
  let canvas = document.getElementById("shareCanvas");
  if (!canvas || canvas.tagName !== 'CANVAS') {
    wrap.innerHTML = '<canvas id="shareCanvas" width="1600" height="2160" style="width:100%;display:block;border-radius:14px;"></canvas>';
    canvas = document.getElementById("shareCanvas");
  }
  canvas.width = 1600; canvas.height = 2160;
  const SCALE=2, W=800, H=1080;
  canvas.width=W*SCALE; canvas.height=H*SCALE;
  canvas.style.width='100%';
  const ctx=canvas.getContext('2d');
  ctx.scale(SCALE,SCALE);
  const theme = BG_THEMES.find(t=>t.id===shareState.bgId);
  const specialTheme = !theme ? SPECIAL_THEMES.find(t => t.id === shareState.bgId) : null;

  // 特殊圖片主題 - 先畫底圖
  if (specialTheme && specialTheme.bg_type === 'image') {
    await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { ctx.drawImage(img, 0, 0, W, H); resolve(); };
      img.onerror = () => { ctx.fillStyle = '#0a0b10'; ctx.fillRect(0,0,W,H); resolve(); };
      img.src = specialTheme.preview_url;
    });
  } else if (theme) {
    // 底色 + 光暈
    ctx.fillStyle = theme.colors[0];
    ctx.fillRect(0,0,W,H);

    if (theme.id === 'cyberwave' || theme.id === 'peachbloom') {
    if (theme.id === 'peachbloom') {
      // 亮底暖色液態 blob
      ctx.fillStyle = '#fde8dc'; ctx.fillRect(0,0,W,H);
      const pbBlobs = [
        // 粉紅群
        {x:0.45,y:0.35,rx:0.70,ry:0.55,r:255,g:100,b:130,a:0.55},
        {x:0.75,y:0.72,rx:0.65,ry:0.70,r:255,g:60, b:120,a:0.70},
        {x:0.30,y:0.55,rx:0.60,ry:0.50,r:255,g:140,b:160,a:0.40},
        // 橘紅群
        {x:0.92,y:0.08,rx:0.55,ry:0.50,r:240,g:90, b:60, a:0.75},
        {x:0.30,y:0.92,rx:0.70,ry:0.45,r:255,g:160,b:90, a:0.55},
        // 亮粉白提亮
        {x:0.25,y:0.30,rx:0.65,ry:0.55,r:255,g:220,b:220,a:0.60},
      ];
      pbBlobs.forEach(b => {
        ctx.save();
        ctx.scale(1, b.ry/b.rx);
        const grd = ctx.createRadialGradient(
          W*b.x, H*b.y/(b.ry/b.rx), 0,
          W*b.x, H*b.y/(b.ry/b.rx), W*b.rx
        );
        grd.addColorStop(0,    `rgba(${b.r},${b.g},${b.b},${b.a})`);
        grd.addColorStop(0.55, `rgba(${b.r},${b.g},${b.b},0.08)`);
        grd.addColorStop(1,    `rgba(${b.r},${b.g},${b.b},0)`);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H/(b.ry/b.rx));
        ctx.restore();
      });
    } else {
    // 純黑底
    ctx.fillStyle = '#060808'; ctx.fillRect(0,0,W,H);

    // 液態青綠：大範圍橢圓互相融合
    const blobs = [
      {x:0.20,y:0.50,rx:0.90,ry:0.65,c:'rgba(46,196,182,0.65)'},
      {x:0.45,y:0.75,rx:0.80,ry:0.55,c:'rgba(176,232,224,0.45)'},
      {x:0.08,y:0.85,rx:0.75,ry:0.50,c:'rgba(13,122,114,0.55)'},
      {x:0.35,y:0.35,rx:0.70,ry:0.60,c:'rgba(0,180,160,0.40)'},
      {x:0.55,y:0.60,rx:0.65,ry:0.80,c:'rgba(46,196,182,0.30)'},
    ];
    blobs.forEach(b => {
      ctx.save();
      ctx.scale(1, b.ry/b.rx);
      const grd2 = ctx.createRadialGradient(
        W*b.x, H*b.y/(b.ry/b.rx), 0,
        W*b.x, H*b.y/(b.ry/b.rx), W*b.rx
      );
      const fade = b.c.replace(/[^,]+\)$/, '0)');
      grd2.addColorStop(0,    b.c);
      grd2.addColorStop(0.60, b.c.replace(/[^,]+\)$/, '0.08)'));
      grd2.addColorStop(1,    fade);
      ctx.fillStyle = grd2;
      ctx.fillRect(0, 0, W, H/(b.ry/b.rx));
      ctx.restore();
    });

    // 液態紅：大範圍橢圓，跟青綠自然融合
    const redBlobs = [
      {x:0.85,y:0.60,rx:0.75,ry:0.90,c:'rgba(192,21,26,0.72)'},
      {x:0.70,y:0.85,rx:0.70,ry:0.60,c:'rgba(160,10,15,0.50)'},
      {x:0.98,y:0.40,rx:0.60,ry:0.75,c:'rgba(100,5,8,0.42)'},
      {x:0.65,y:0.50,rx:0.55,ry:0.70,c:'rgba(80,5,8,0.28)'},
    ];
    redBlobs.forEach(b => {
      ctx.save();
      ctx.scale(1, b.ry/b.rx);
      const grd2 = ctx.createRadialGradient(
        W*b.x, H*b.y/(b.ry/b.rx), 0,
        W*b.x, H*b.y/(b.ry/b.rx), W*b.rx
      );
      const fade = b.c.replace(/[^,]+\)$/, '0)');
      grd2.addColorStop(0,    b.c);
      grd2.addColorStop(0.60, b.c.replace(/[^,]+\)$/, '0.06)'));
      grd2.addColorStop(1,    fade);
      ctx.fillStyle = grd2;
      ctx.fillRect(0, 0, W, H/(b.ry/b.rx));
      ctx.restore();
    });

    // 四周壓暗，突出中央液態混合區
    const dark = ctx.createRadialGradient(W*0.45,H*0.60,W*0.05,W*0.45,H*0.60,W*1.1);
    dark.addColorStop(0,   'rgba(0,0,0,0)');
    dark.addColorStop(0.7, 'rgba(0,0,0,0.25)');
    dark.addColorStop(1,   'rgba(0,0,0,0.6)');
    ctx.fillStyle = dark; ctx.fillRect(0,0,W,H);
    } // end cyberwave
  } else {
    theme.stops.forEach(s => {
      const grd = ctx.createRadialGradient(W*s.cx/100,H*s.cy/100,0,W*s.cx/100,H*s.cy/100,Math.max(W,H)*s.r/100);
      grd.addColorStop(0,   hexToRgba(s.c, Math.min(s.o * 1.25, 1)));
      grd.addColorStop(0.35,hexToRgba(s.c, s.o * 0.6));
      grd.addColorStop(1,   hexToRgba(s.c, 0));
      ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    });
  }
  } // end else if (theme)

  // 網格 80px 間距
  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=0.6;
  for(let x=80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=80;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // ── 頂部資訊列 ──
  ctx.fillStyle='rgba(255,255,255,0.88)';
  ctx.font='600 18px "Inter","Helvetica Neue",sans-serif';
  ctx.fillText('WINNING',60,80);
  ctx.fillStyle='rgba(255,255,255,0.42)';
  ctx.font='400 14.5px "Inter",sans-serif';
  ctx.fillText('COMBO',60,100);

  ctx.fillStyle='rgba(255,255,255,0.88)';
  ctx.font='600 18px "Inter","Helvetica Neue",sans-serif';
  ctx.fillText('BEYBLADE X TIER',260,80);
  ctx.fillStyle='rgba(255,255,255,0.42)';
  ctx.font='400 14.5px "Inter",sans-serif';
  ctx.fillText('TAIWAN',260,100);

  // 右：書籤 icon（圓角）+ crafted by，底部對齊
  ctx.font='400 14.5px "Inter",sans-serif';
  const dbText = ' Crafted by  @stan_yao';
  const dbW = ctx.measureText(dbText).width;
  const textBaselineY = 90; // 文字 baseline

  // 書籤放在文字左邊，底部跟文字 baseline 對齊
  const bkW = 13, bkH = 18, bkR = 2.5;
  const bkX = W - 45 - dbW - 20;
  const bkY = textBaselineY - bkH + 5; // 底部對齊 baseline

  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.beginPath();
  // 圓角矩形頂部
  ctx.moveTo(bkX + bkR, bkY);
  ctx.lineTo(bkX + bkW - bkR, bkY);
  ctx.quadraticCurveTo(bkX + bkW, bkY, bkX + bkW, bkY + bkR);
  // 右側到 V 點
  ctx.lineTo(bkX + bkW, bkY + bkH);
  // V 型底部
  ctx.lineTo(bkX + bkW/2, bkY + bkH - 5);
  ctx.lineTo(bkX, bkY + bkH);
  // 左側回到圓角
  ctx.lineTo(bkX, bkY + bkR);
  ctx.quadraticCurveTo(bkX, bkY, bkX + bkR, bkY);
  ctx.closePath();
  ctx.fill();

  ctx.textAlign='right';
  ctx.fillStyle='rgba(255,255,255,0.42)';
  ctx.fillText(dbText, W-45, textBaselineY);
  ctx.textAlign='left';

  // ── 三行陀螺 ──
  // 固定 4×3 格子，緊密排列，圖片自然出血
  const gridTop = 144;
  const gridH   = 640;
  const cellW   = 200;
  const cellH   = Math.round(gridH / 3);
  const imgSizes = [156, 172, 170, 138];  // 輔助/戰刃/固鎖/軸心

  const getCellCenter = (row, col) => ({
    x: col * cellW + cellW / 2 + (col < 3 ? 30 : 0),
    y: gridTop + row * cellH + cellH / 2,
  });



  // 載入圖片
  const loadTasks = [];
  shareState.combos.forEach((combo, row) => {
    const parts = [
      { item: combo.assist,  cat:'assist'  },
      { item: combo.blade,   cat:'blade'   },
      { item: combo.ratchet, cat:'ratchet' },
      { item: combo.bit,     cat:'bit'     },
    ];
    parts.forEach((p, col) => {
      if (!p.item) return;
      const imgUrl = (p.cat==='blade'||p.cat==='assist') ? getImgUrl(p.item) : PARTS_IMG[p.item.id]||'';
      if (!imgUrl) return;
      loadTasks.push({ imgUrl, row, col });
    });
  });

  const imgResults = await Promise.all(loadTasks.map(task =>
    new Promise(resolve => {
      const img = new Image();
      img.crossOrigin='anonymous';
      img.onload  = ()=>resolve({...task, img});
      img.onerror = ()=>resolve({...task, img:null});
      img.src = task.imgUrl;
    })
  ));

  imgResults.forEach(r => {
    if (!r.img) return;
    const {x, y} = getCellCenter(r.row, r.col);
    const sz = imgSizes[r.col];
    ctx.drawImage(r.img, x-sz/2, y-sz/2, sz, sz);
  });

  // ── 底部大字 ──
  // 字體 Inter Bold 96pt，離左 70px，底行離底 82px
  ctx.font='700 96px "Inter","Helvetica Neue",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.fillText('Beyblade', 70, H-82-85);
  ctx.fillText('X combo',  70, H-82);

  // 右下：備註文字（右對齊，離右 45px，最上緣離底 220px，字間距 25px）
  {
    const noteText = shareState.note.trim();
    const displayLines = noteText
      ? noteText.split('\n').filter(l => l.trim())
      : ['TAIWAN', '｜BEYBLADE X'];
    const isPlaceholder = !noteText;

    ctx.textAlign = 'right';
    ctx.font = '400 22px "Noto Sans TC","Inter",sans-serif';
    ctx.fillStyle = isPlaceholder ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.8)';
    const lineH = 32;
    const totalH = displayLines.length * lineH;
    const startY = H - 82 - 85 - 40; // 對齊 Beyblade 字母上緣
    displayLines.forEach((line, i) => {
      ctx.fillText(line, W - 45, startY + i * lineH);
    });
    ctx.textAlign = 'left';
  }

  // 網址
  ctx.font='400 16px "Inter",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.textAlign='center';
  ctx.fillText('https://stan-yao.github.io/beyblade_x_tier/', W/2, H-24);
  ctx.textAlign='left';

  // 更新下載按鈕（canvas 保持不動，不觸發頁面跳動）
  // 用全域變數存 dataUrl，避免 onclick 字串過長
  window._shareDataUrl = canvas.toDataURL('image/png');
  const btnDiv = document.getElementById('shareDownloadBtn');
  if (btnDiv && !btnDiv.querySelector('button')) {
    btnDiv.innerHTML = `<button onclick="shareImage(window._shareDataUrl)"
      style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding:12px;width:100%;background:linear-gradient(135deg,rgba(18,239,206,0.15),rgba(105,167,255,0.1));border:1px solid rgba(18,239,206,0.3);border-radius:16px;color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      儲存 / 分享圖片
    </button>`;
  } else if (btnDiv) {
    const btn = btnDiv.querySelector('button');
    if (btn) btn.onclick = () => shareImage(window._shareDataUrl);
  }
}

function closeBladePicker() {
  const picker = document.getElementById('bladePicker');
  picker?._cleanupViewport?.();
  picker?.remove();
}
function openPartPicker(row, part) {
  shareState.pickerTarget = { row, part };
  const partLabels = { assist:'輔助戰刃', blade:'戰刃', ratchet:'固鎖', bit:'軸心' };
  const catMap = { assist:'assist', blade:'blade', ratchet:'ratchet', bit:'bit' };
  const picker = document.createElement('div');
  picker.className='blade-picker'; picker.id='bladePicker';
  picker.innerHTML=`<div class="blade-picker-box">
    <div class="blade-picker-head">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="blade-picker-title">選擇第 ${row+1} 組 — ${partLabels[part]}</div>
        <button onclick="closeBladePicker()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--muted);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">✕</button>
      </div>
      <input class="blade-picker-search" id="bladePickerSearch" placeholder="搜尋…" autocomplete="off" oninput="renderPartPickerList(this.value)">
    </div>
    <div class="blade-picker-list" id="bladePickerList"></div>
  </div>`;
  picker.onclick = e => { if(e.target===picker) closeBladePicker(); };
  document.body.appendChild(picker);
  // iOS 鍵盤彈起時，只調整一次 picker 位置，不持續監聽 scroll
  if (window.visualViewport) {
    let adjusted = false;
    const adjustOnce = () => {
      if (adjusted) return;
      const vvBottom = window.visualViewport.offsetTop + window.visualViewport.height;
      const bottom = window.innerHeight - vvBottom;
      if (bottom > 100) { // 鍵盤確實彈起才調整
        picker.style.bottom = bottom + 'px';
        adjusted = true;
      }
    };
    window.visualViewport.addEventListener('resize', adjustOnce);
    picker._cleanupViewport = () => {
      window.visualViewport.removeEventListener('resize', adjustOnce);
    };
  }
  renderPartPickerList('');
  setTimeout(()=>document.getElementById('bladePickerSearch')?.focus(),100);
}

function renderPartPickerList(q) {
  const list = document.getElementById('bladePickerList');
  if (!list || !shareState.pickerTarget) return;
  const { row, part } = shareState.pickerTarget;
  const catMap = { assist:'assist', blade:'blade', ratchet:'ratchet', bit:'bit' };
  const items = DB.filter(x=>x.cat===catMap[part]);
  const filtered = q.trim()
    ? items.filter(b => norm(b.name).includes(norm(q)) || norm(b.id).includes(norm(q)))
    : items;

  const uniqueItems = part==='ratchet'||part==='bit'
    ? [...new Map(filtered.map(x=>[x.id,x])).values()]
    : filtered;

  const hasCurrent = shareState.combos[row][part] !== null;
  list.innerHTML = (hasCurrent ? `
    <div class="blade-picker-item" onclick="selectPartForSlot(null)" style="color:var(--danger);border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:6px;padding-bottom:12px;">
      <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0.7;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <div class="blade-picker-item-info">
        <div class="blade-picker-item-name" style="color:var(--danger);">取消選擇</div>
      </div>
    </div>` : '') + uniqueItems.map(item => {
    const imgUrl = part==='blade'||part==='assist' ? getImgUrl(item) : PARTS_IMG[item.id]||'';
    const thumb = imgUrl
      ? `<img src="${imgUrl}" crossorigin="anonymous" width="44" height="44" style="object-fit:contain;flex-shrink:0;">`
      : `<div class="blade-picker-item-ph"></div>`;
    return `<div class="blade-picker-item" onclick="selectPartForSlot('${item.id}')">
      ${thumb}
      <div class="blade-picker-item-info">
        <div class="blade-picker-item-name">${item.name}</div>
        <div class="blade-picker-item-id">${item.id}</div>
      </div>
    </div>`;
  }).join('');
}

function selectPartForSlot(itemId) {
  if (!shareState.pickerTarget) return;
  const { row, part } = shareState.pickerTarget;
  if (itemId === null) {
    shareState.combos[row][part] = null;
    closeBladePicker();
    renderSharePage();
    return;
  }
  const catMap = { assist:'assist', blade:'blade', ratchet:'ratchet', bit:'bit' };
  const item = DB.find(x=>x.id===itemId&&x.cat===catMap[part])
            || DB.find(x=>x.id===itemId);
  if (!item) return;
  shareState.combos[row][part] = item;

  // 戰刃選好後自動帶入原裝固鎖/軸心/輔助
  if (part==='blade') {
    if (item.ratchet && !shareState.combos[row].ratchet) {
      shareState.combos[row].ratchet = DB.find(x=>x.cat==='ratchet'&&x.id===item.ratchet) || {id:item.ratchet,name:item.ratchet,cat:'ratchet'};
    }
    if (item.bit && !shareState.combos[row].bit) {
      shareState.combos[row].bit = DB.find(x=>x.cat==='bit'&&x.id===item.bit) || {id:item.bit,name:item.bit,cat:'bit'};
    }
    if (item.assistBlade && !shareState.combos[row].assist) {
      shareState.combos[row].assist = DB.find(x=>x.cat==='assist'&&x.id==='輔助'+item.assistBlade) || null;
    }
  }
  closeBladePicker();
  renderSharePage();
}

function getPartsFromOwnedBlades(inv) {
  const rSet = new Set(), bSet = new Set(), aSet = new Set(), bladeSet = new Set(), coverSet = new Set();
  (inv.ownedBlades || []).forEach(bladeId => {
    bladeSet.add(bladeId);
    coverSet.add(bladeId); // 上蓋代號 = 陀螺產品代號
    const blade = DB.find(x => x.cat === 'blade' && x.id === bladeId);
    if (!blade) return;
    if (blade.ratchet) rSet.add(blade.ratchet);
    if (blade.bit) bSet.add(blade.bit);
    if (blade.assistBlade) aSet.add("輔助" + blade.assistBlade);
  });
  return { ratchet: rSet, bit: bSet, assist: aSet, blade: bladeSet, bladeCover: coverSet };
}

function exportData() {
  const inv = loadInventory();
  const json = JSON.stringify(inv);
  const code = btoa(unescape(encodeURIComponent(json)));
  navigator.clipboard.writeText(code).then(() => {
    const el = document.getElementById("exportResult");
    el.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(122,223,96,0.1);border:1px solid rgba(122,223,96,0.25);border-radius:10px;font-size:0.8rem;color:var(--success);">✅ 代碼已複製成功！請儲存至新裝置使用。</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 4000);
  }).catch(() => {
    const el = document.getElementById("exportResult");
    el.innerHTML = `<div style="margin-bottom:6px;font-size:0.75rem;color:var(--muted);">請手動複製以下代碼：</div>
      <textarea readonly onclick="this.select()" style="width:100%;min-height:70px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--accent);font-size:16px;padding:10px;resize:none;outline:none;box-sizing:border-box;word-break:break-all;">${code}</textarea>`;
  });
}

function importData() {
  const raw = (document.getElementById("importInput")?.value || "").trim();
  if (!raw) {
    showTransferMsg("importResult", "⚠ 請先貼上代碼", "warn"); return;
  }
  try {
    const json = decodeURIComponent(escape(atob(raw)));
    const data = JSON.parse(json);
    if (typeof data !== 'object' || data === null) throw new Error();
    saveInventory(data);
    showTransferMsg("importResult", "✅ 匯入成功！倉庫資料已更新。", "success");
    document.getElementById("importInput").value = "";
  } catch {
    showTransferMsg("importResult", "❌ 代碼無效，請確認是否完整複製。", "danger");
  }
}

function showTransferMsg(id, msg, type) {
  const colors = { success:"rgba(122,223,96,0.1)|rgba(122,223,96,0.25)|var(--success)", warn:"rgba(255,184,48,0.1)|rgba(255,184,48,0.25)|var(--warn)", danger:"rgba(255,94,122,0.1)|rgba(255,94,122,0.25)|var(--danger)" };
  const [bg, border, color] = colors[type].split("|");
  const el = document.getElementById(id);
  if (el) {
    el.innerHTML = `<div style="padding:10px 14px;background:${bg};border:1px solid ${border};border-radius:10px;font-size:0.8rem;color:${color};">${msg}</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 4000);
  }
}

function renderOverview(inv, fromBlades) {
  const ownedBladeIds = new Set(inv.ownedBlades || []);

  const ownedR = new Set([...(inv.ratchet||[]), ...fromBlades.ratchet]);
  const ownedB = new Set([...(inv.bit||[]),     ...fromBlades.bit]);

  const total = ownedC.size + ownedA.size + ownedR.size + ownedB.size;

  if (total === 0) {
    document.getElementById("invSubContent").innerHTML =

    return;

  function makeCards(ids, cat) {

                 || (cat==='bit'&&fromBlades.bit.has(id))

        <div class="owned-blade-info">
          <div class="owned-blade-name">${item?.name || id}</div>

        </div>
      </div>`;
    }).join('');
  }

  const allBladeIds = new Set([...ownedBladeIds, ...looseBlades]);

  const sections = [
    { label:'戰刃上蓋 BLADE COVER',  ids: ownedC,      cat:'bladeCover' },
    { label:'輔助戰刃 ASSIST',       ids: ownedA,      cat:'assist' },
    { label:'固鎖 RATCHET',          ids: ownedR,      cat:'ratchet' },

            renderVaultTab();

          font-size:0.7rem;color:var(--danger);
          background:rgba(255,94,122,0.08);
          border:1px solid rgba(255,94,122,0.25);

      </div>

    ${sections.map(s => `
      <div class="vault-section" style="margin-bottom:10px;">
